<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cookplan-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CookPlan — Dapur Cerdas: Atur Menu & Belanja Mingguan Otomatis</title>
    <meta name="description" content="CookPlan adalah aplikasi cerdas untuk merencanakan menu masak mingguan. Dapatkan rekomendasi resep nusantara, atur jadwal makan, dan hasilkan daftar belanja otomatis dengan estimasi biaya dari petani lokal." />

    <!-- PWA: installable "Add to Home Screen" (kayak app native) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#375219" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS Safari: jalankan fullscreen tanpa address bar saat dibuka dari home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CookPlan" />

    
    <!-- Open Graph / Social Media Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cookplan.id/" />
    <meta property="og:title" content="CookPlan — Dapur Cerdas: Atur Menu & Belanja Mingguan Otomatis" />
    <meta property="og:description" content="CookPlan adalah aplikasi cerdas untuk merencanakan menu masak mingguan. Dapatkan rekomendasi resep nusantara, atur jadwal makan, dan hasilkan daftar belanja otomatis secara praktis." />
    <!-- og:image self-hosted (landscape 16:9) → kartu share tampil besar &
         tak bergantung CDN eksternal yang bisa kedaluwarsa. -->
    <meta property="og:image" content="https://cookplan.id/hero-poster.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="CookPlan — rencana menu masak mingguan & daftar belanja otomatis" />
    <meta property="og:site_name" content="CookPlan" />

    <!-- Twitter Card (twitter:image otomatis fallback ke og:image) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CookPlan — Dapur Cerdas: Atur Menu & Belanja Mingguan Otomatis" />
    <meta name="twitter:description" content="Susun menu masak mingguan, dapatkan daftar belanja otomatis, dan masak hemat anti food waste — dengan rekomendasi bertenaga AI." />

    <!-- Google Fonts dimuat ASINKRON (non-render-blocking) supaya tidak menunda
         first paint di mobile. Pola: preload as=style → onload jadikan stylesheet;
         <noscript> sebagai fallback bila JS mati. Material Symbols tetap
         display=block agar ikon tak sempat tampil sebagai teks ligatur mentah. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet" />
    </noscript>

    <!-- Canonical self-referensi per-rute. SPA tanpa SSR: tag dibuat saat load
         sesuai URL yang dirayapi, sehingga tiap halaman (dirayapi terpisah oleh
         Googlebot yang merender JS) mengkanonikalisasi dirinya sendiri — bukan
         dipaksa ke beranda. Tanpa JS: tidak ada canonical (netral, tidak salah). -->
    <script>
      (function () {
        var l = document.createElement("link");
        l.rel = "canonical";
        l.href = location.origin + location.pathname;
        document.head.appendChild(l);
      })();
    </script>

    <!-- Structured data (JSON-LD) untuk rich result Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://cookplan.id/#organization",
            "name": "CookPlan",
            "url": "https://cookplan.id/",
            "logo": "https://cookplan.id/icon-512.png"
          },
          {
            "@type": "WebApplication",
            "@id": "https://cookplan.id/#webapp",
            "name": "CookPlan",
            "url": "https://cookplan.id/",
            "applicationCategory": "LifestyleApplication",
            "operatingSystem": "Web",
            "inLanguage": "id-ID",
            "description": "CookPlan adalah aplikasi dapur cerdas untuk merencanakan menu masak mingguan, membuat daftar belanja otomatis, dan masak hemat dengan rekomendasi bertenaga AI.",
            "publisher": { "@id": "https://cookplan.id/#organization" },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "IDR"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
