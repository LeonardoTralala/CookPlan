    <!-- Canonical self-referensi per-rute. SPA tanpa SSR: tag dibuat saat load
         sesuai URL yang dirayapi, sehingga tiap halaman (dirayapi terpisah oleh
         Googlebot yang merender JS) mengkanonikalisasi dirinya sendiri — bukan
         dipaksa ke beranda. Tanpa JS: tidak ada canonical (netral, tidak salah). -->
    <script>
      (function () {
        var l = document.createElement("link");
        l.rel = "canonical";
        l.href = location.origin + location.pathname;
        document.head.appendChild(l);
      })();
    </script>
